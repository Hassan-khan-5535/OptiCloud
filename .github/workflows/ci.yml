name: Cindr CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  publish:
    name: Build and publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t "$IMAGE_NAMESPACE/cindr-api:$IMAGE_TAG" -t "$IMAGE_NAMESPACE/cindr-api:latest" .
          docker push "$IMAGE_NAMESPACE/cindr-api:$IMAGE_TAG"
          docker push "$IMAGE_NAMESPACE/cindr-api:latest"
      - name: Build and push worker image
        run: |
          docker build -f apps/worker/Dockerfile -t "$IMAGE_NAMESPACE/cindr-worker:$IMAGE_TAG" -t "$IMAGE_NAMESPACE/cindr-worker:latest" .
          docker push "$IMAGE_NAMESPACE/cindr-worker:$IMAGE_TAG"
          docker push "$IMAGE_NAMESPACE/cindr-worker:latest"
      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile -t "$IMAGE_NAMESPACE/cindr-web:$IMAGE_TAG" -t "$IMAGE_NAMESPACE/cindr-web:latest" .
          docker push "$IMAGE_NAMESPACE/cindr-web:$IMAGE_TAG"
          docker push "$IMAGE_NAMESPACE/cindr-web:latest"
