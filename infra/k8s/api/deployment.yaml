apiVersion: apps/v1
kind: Deployment
metadata: { name: cindr-api, labels: { app: cindr-api } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cindr-api } }
  template:
    metadata: { labels: { app: cindr-api } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          image: ghcr.io/atifkhani397/cindr-api:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: cindr-api-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: DATABASE_URL } }
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: AUTH_SECRET } }
            - name: SLACK_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: SLACK_SIGNING_SECRET } }
            - name: SLACK_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: SLACK_BOT_TOKEN } }
            - name: SLACK_CHANNEL_ID
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: SLACK_CHANNEL_ID } }
          readinessProbe:
            httpGet: { path: /ready, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
