apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/configmap.yaml
  - worker/deployment.yaml
  - worker/configmap.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/configmap.yaml

images:
  - name: cindr/api
    newName: ghcr.io/atifkhani397/cindr-api
    newTag: latest
  - name: cindr/worker
    newName: ghcr.io/atifkhani397/cindr-worker
    newTag: latest
  - name: cindr/web
    newName: ghcr.io/atifkhani397/cindr-web
    newTag: latest
