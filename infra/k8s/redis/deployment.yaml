apiVersion: apps/v1
kind: Deployment
metadata:
  name: cindr-redis
  labels: { app: cindr-redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cindr-redis }
  template:
    metadata:
      labels: { app: cindr-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
