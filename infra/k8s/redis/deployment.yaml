apiVersion: apps/v1
kind: Deployment
metadata:
  name: cindr-redis
  labels: { app: cindr-redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cindr-redis }
  template:
    metadata:
      labels: { app: cindr-redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          image: redis:7.4-alpine
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
