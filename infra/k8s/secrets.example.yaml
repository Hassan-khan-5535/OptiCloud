apiVersion: v1
kind: Secret
metadata:
  name: cindr-secrets
type: Opaque
stringData:
  POSTGRES_USER: cindr
  POSTGRES_PASSWORD: replace-with-random-password
  POSTGRES_DB: cindr
  DATABASE_URL: postgresql://cindr:replace-with-random-password@cindr-postgres:5432/cindr
  AUTH_SECRET: replace-with-at-least-32-random-bytes
  GITHUB_ID: replace-with-github-oauth-client-id
  GITHUB_SECRET: replace-with-github-oauth-client-secret
  SLACK_SIGNING_SECRET: replace-with-slack-signing-secret
  SLACK_BOT_TOKEN: replace-with-slack-bot-token
  AWS_ACCESS_KEY_ID: replace-if-using-static-credentials
  AWS_SECRET_ACCESS_KEY: replace-if-using-static-credentials
  AWS_SESSION_TOKEN: replace-if-using-temporary-credentials
