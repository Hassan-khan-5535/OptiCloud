apiVersion: apps/v1
kind: Deployment
metadata: { name: cindr-web, labels: { app: cindr-web } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cindr-web } }
  template:
    metadata: { labels: { app: cindr-web } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          image: ghcr.io/atifkhani397/cindr-web:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: cindr-web-config }
          env:
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: AUTH_SECRET } }
            - name: GITHUB_ID
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: GITHUB_ID } }
            - name: GITHUB_SECRET
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: GITHUB_SECRET } }
          readinessProbe:
            httpGet: { path: /auth/signin, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /auth/signin, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 10
