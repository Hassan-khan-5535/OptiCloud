apiVersion: apps/v1
kind: Deployment
metadata: { name: cindr-worker, labels: { app: cindr-worker } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cindr-worker } }
  template:
    metadata: { labels: { app: cindr-worker } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          image: ghcr.io/atifkhani397/cindr-worker:latest
          envFrom:
            - configMapRef: { name: cindr-worker-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: DATABASE_URL } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: AWS_ACCESS_KEY_ID, optional: true } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: AWS_SECRET_ACCESS_KEY, optional: true } }
            - name: AWS_SESSION_TOKEN
              valueFrom: { secretKeyRef: { name: cindr-secrets, key: AWS_SESSION_TOKEN, optional: true } }
          startupProbe:
            exec: { command: ["sh", "-c", "kill -0 1"] }
            failureThreshold: 30
            periodSeconds: 10
